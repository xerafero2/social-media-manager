name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.29.0'
        channel: 'stable'

    - name: Generate Android System (V2)
      run: flutter create --project-name social_media_manager --org com.example --platforms=android .

    - name: Patch Biometric Configuration
      run: |
        # 1. Mengubah Activity menjadi FragmentActivity untuk local_auth
        cat << 'EOF' > android/app/src/main/kotlin/com/example/social_media_manager/MainActivity.kt
        package com.example.social_media_manager
        
        import io.flutter.embedding.android.FlutterFragmentActivity
        
        class MainActivity: FlutterFragmentActivity() {
        }
        EOF
        
        # 2. Menyisipkan Izin Biometrik ke dalam AndroidManifest.xml
        sed -i 's/<application/    <uses-permission android:name="android.permission.USE_BIOMETRIC"\/>\n    <uses-permission android:name="android.permission.USE_FINGERPRINT"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml

    - name: Get dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
