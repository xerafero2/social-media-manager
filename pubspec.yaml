publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  sqflite: ^2.3.0
  path: ^1.8.3
  encrypt: ^5.0.3
  font_awesome_flutter: ^10.7.0
  fl_chart: ^0.65.0
  intl: ^0.19.0
  otp: ^3.1.2
  image_picker: ^1.1.2
  path_provider: ^2.1.2
  local_auth: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
